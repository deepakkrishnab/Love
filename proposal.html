<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>One Last Question 💍</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a class="home-icon-btn" href="index.html" aria-label="Home">🏡</a>
  <span class="floaty" style="top:10%; left:8%;">💐</span>
  <span class="floaty" style="top:14%; left:86%; animation-delay: 1s;">🌸</span>
  <span class="floaty" style="top:22%; left:40%; animation-delay: 1.6s;">🦋</span>
  <span class="floaty" style="top:32%; left:65%; animation-delay: 0.6s;">🌼</span>
  <span class="floaty" style="top:50%; left:8%; animation-delay: 2.2s;">🌷</span>
  <span class="floaty" style="top:58%; left:90%; animation-delay: 1.2s;">🦋</span>
  <span class="floaty" style="top:80%; left:10%; animation-delay: 2s;">🦋</span>
  <span class="floaty" style="top:88%; left:82%; animation-delay: 0.8s;">🌺</span>

  <h1 class="wonder-title">One Last Question 💍</h1>
  <p class="wonder-subtitle">Just one simple question, Nivi...</p>

  <div class="wonder-card" id="proposal-card">
    <p style="font-size: 1.4rem; font-weight: 700;">Will you marry me? 💍</p>
    <div class="button-row-stack">
      <button class="btn btn-yes" id="yes-btn">Yes, forever</button>
      <button class="btn btn-no" id="no-btn">Na Dubai poran</button>
    </div>
  </div>

  <footer class="wonder-footer">made with 💖 just for Nivi</footer>

  <div class="reveal-overlay" id="reveal">
    <div class="nickname-wall" aria-hidden="true">
      <span style="top:8%; left:10%; transform: rotate(-8deg);">Nivi</span>
      <span style="top:14%; left:78%; transform: rotate(6deg);">Gundama</span>
      <span style="top:28%; left:6%; transform: rotate(5deg);">Kudikari</span>
      <span style="top:34%; left:86%; transform: rotate(-5deg);">Kutty Addu</span>
      <span style="top:50%; left:4%; transform: rotate(-10deg);">Erruma maddu</span>
      <span style="top:58%; left:88%; transform: rotate(8deg);">Goindamma</span>
      <span style="top:74%; left:12%; transform: rotate(7deg);">Rowdy</span>
      <span style="top:80%; left:80%; transform: rotate(-6deg);">Pondatti</span>
      <span style="top:90%; left:30%; transform: rotate(4deg);">Nivi</span>
      <span style="top:92%; left:60%; transform: rotate(-4deg);">Gundama</span>
      <span style="top:4%; left:45%; transform: rotate(3deg);">Kudikari</span>
      <span style="top:68%; left:45%; transform: rotate(-3deg);">Rowdy</span>
    </div>

    <div class="reveal-content">
      <span class="reveal-ring">💍</span>
      <p class="reveal-text">She said YES! 🎉</p>
      <p class="reveal-text" style="font-size: 1.2rem;">I Love you too my girl 💖</p>
    </div>
  </div>

  <script src="js/dodge.js"></script>
  <script src="js/confetti.js"></script>
  <script src="js/transitions.js"></script>
  <script>
    const noBtn = document.getElementById('no-btn');
    WonderDodge.makeUndodgeable(noBtn);

    const yesBtn = document.getElementById('yes-btn');
    const reveal = document.getElementById('reveal');

    yesBtn.addEventListener('click', () => {
      reveal.classList.add('show');
      WonderConfetti.burstConfetti({ count: 120 });
      setInterval(() => WonderConfetti.burstConfetti({ count: 30 }), 1200);
    });
  </script>
</body>
</html>
